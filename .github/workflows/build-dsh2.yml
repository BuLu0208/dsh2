name: Build 冷夜的 dsh 小作坊

on:
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: 'DSH source ref (tag/branch/sha)'
        required: false
        default: 'master'
      product_name:
        description: 'App display name'
        required: false
        default: '冷夜的 dsh 小作坊'
      skip_build:
        description: '跳过 Build DSH（复用缓存，仅重打包）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  NODE_VERSION: '24.18.1'
  PNPM_VERSION: '11.28.5'
  DSH_REPO: 'deepseek-ai/deepseek-harness'
  PURGE_REPO: 'BuLu0208/dsh-purge1171'
  # 缓存版本号：改了补丁或构建脚本就 +1 以跳过旧缓存
  CACHE_REV: 'v2'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Checkout DSH source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DSH_REPO }}
          ref: ${{ inputs.dsh_ref || 'master' }}
          path: dsh
          fetch-depth: 1

      - name: Checkout dsh-purge (1.1.71 满血版)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PURGE_REPO }}
          ref: master
          path: purge
          fetch-depth: 1

      - name: Report versions
        run: |
          DSH_VER=$(node -p "require('./dsh/package.json').version")
          DSH_SHA=$(git -C dsh rev-parse --short HEAD)
          PURGE_VER=$(node -p "require('./purge/package.json').version")
          PURGE_SHA=$(git -C purge rev-parse --short HEAD)
          echo "DSH_VER=$DSH_VER" >> $GITHUB_ENV
          echo "DSH_SHA=$DSH_SHA" >> $GITHUB_ENV
          {
            echo "### 版本信息"
            echo "- DSH: \`$DSH_VER\` ($DSH_SHA)"
            echo "- purge: \`$PURGE_VER\` ($PURGE_SHA)"
            echo "- 缓存代数: \`$CACHE_REV\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Apply host patches
        run: |
          cd dsh
          git apply --verbose ../recipe/patches/host.patch
          git apply --verbose ../recipe/patches/branding.patch
          git apply --verbose ../recipe/patches/fileprompt.patch
          echo "✓ 三组补丁全部应用"
          cp ../recipe/config/env.macos apps/desktop/.env.macos
          echo "✓ .env.macos 就位"

      - name: Verify blacklisted prompt is gone from source
        run: |
          set -e
          HITS=$(grep -rn 'Tokens prefixed with @' dsh/packages/ --include='*.ts' 2>/dev/null | wc -l | tr -d ' ')
          echo "source hits: $HITS"
          if [ "$HITS" != "0" ]; then
            echo "::error::黑名单文案仍在源码中（$HITS 处）"
            grep -rn 'Tokens prefixed with @' dsh/packages/ --include='*.ts' | head -5
            exit 1
          fi
          echo "✓ 源码层黑名单文案 0 命中"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 缓存 1：pnpm store（依赖包本体，最大头） ──
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/pnpm/store
            ~/.local/share/pnpm/store
            dsh/node_modules/.cache
          key: pnpm-${{ runner.os }}-${{ env.CACHE_REV }}-${{ hashFiles('dsh/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ env.CACHE_REV }}-
            pnpm-${{ runner.os }}-

      # ── 缓存 2：构建产物（tsc 增量 + tsdown 输出） ──
      - name: Cache DSH build outputs
        id: cache-build
        if: ${{ !inputs.skip_build }}
        uses: actions/cache@v4
        with:
          path: |
            dsh/**/dist
            dsh/**/lib
            dsh/**/*.tsbuildinfo
          key: dshbuild-${{ runner.os }}-${{ env.CACHE_REV }}-${{ env.DSH_SHA }}-${{ hashFiles('recipe/patches/*.patch') }}

      # ── 缓存 3：Electron 下载与解包 ──
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            dsh/apps/desktop/.desktop-build/downloads
          key: electron-${{ runner.os }}-${{ hashFiles('dsh/apps/desktop/package.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build DSH
        if: ${{ !inputs.skip_build && steps.cache-build.outputs.cache-hit != 'true' }}
        working-directory: dsh
        run: pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build DSH (cache hit, skip)
        if: ${{ inputs.skip_build || steps.cache-build.outputs.cache-hit == 'true' }}
        run: echo "✓ 复用已缓存的构建产物，跳过编译"

      - name: Prepare runtime
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          DSH_DESKTOP_ARTIFACT_SLUG: 'dsh2'
          DSH_DESKTOP_URL_SCHEME: 'dsh2'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run --filter @deepseek-ai/dsh-desktop prepare:runtime

      - name: Prepare package
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run prepare:desktop

      - name: Package macOS arm64 (unsigned)
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          DSH_DESKTOP_ARTIFACT_SLUG: 'dsh2'
          DSH_DESKTOP_URL_SCHEME: 'dsh2'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Verify blacklisted prompt is gone from packaged app
        run: |
          set -e
          ART_ROOT=dsh/apps/desktop/.desktop-build/targets/mac-arm64
          APP=$(find "$ART_ROOT" -maxdepth 4 -name '*.app' -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find dsh/apps/desktop/.desktop-build -maxdepth 6 -name '*.app' -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "::warning::未找到 .app 目录，跳过产物校验"
            exit 0
          fi
          echo "APP=$APP"
          HITS=$(grep -r "Tokens prefixed with @" "$APP" 2>/dev/null | wc -l | tr -d ' ')
          echo "packaged hits: $HITS"
          if [ "$HITS" != "0" ]; then
            echo "::error::打包产物中黑名单文案仍在（$HITS 处）"
            grep -rn "Tokens prefixed with @" "$APP" 2>/dev/null | head -3
            exit 1
          fi
          echo "✓ 打包产物黑名单文案 0 命中"
          echo "- 打包产物校验：0 命中" >> "$GITHUB_STEP_SUMMARY"

      - name: List artifacts
        run: |
          echo "=== 产物 ==="
          ls -lh dsh/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/ 2>/dev/null || echo "(unsigned-artifacts 为空)"
          find dsh/apps/desktop/.desktop-build -maxdepth 5 \( -name '*.dmg' -o -name '*.zip' \) 2>/dev/null | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh2-macos-arm64-${{ github.run_number }}
          path: |
            dsh/apps/desktop/.desktop-build/**/unsigned-artifacts/*.dmg
            dsh/apps/desktop/.desktop-build/**/unsigned-artifacts/*.zip
            dsh/apps/desktop/.desktop-build/**/*.dmg
            dsh/apps/desktop/.desktop-build/**/*.zip
          retention-days: 30
          if-no-files-found: warn
