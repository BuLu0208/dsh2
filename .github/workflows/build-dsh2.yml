name: Build 冷夜的 dsh 小作坊

on:
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: 'DSH source ref (tag/branch/sha)'
        required: false
        default: 'master'
      product_name:
        description: 'App display name'
        required: false
        default: '冷夜的 dsh 小作坊'
      skip_build:
        description: '跳过 Build DSH（复用缓存，仅重打包）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  NODE_VERSION: '24.18.1'
  PNPM_VERSION: '11.28.5'
  DSH_REPO: 'deepseek-ai/deepseek-harness'
  PURGE_REPO: 'BuLu0208/dsh-purge1171'
  # 缓存版本号：改了补丁或构建脚本就 +1 以跳过旧缓存
  CACHE_REV: 'v2'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Checkout DSH source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DSH_REPO }}
          ref: ${{ inputs.dsh_ref || 'master' }}
          path: dsh
          fetch-depth: 1

      - name: Checkout dsh-purge (1.1.71 满血版)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PURGE_REPO }}
          ref: master
          path: purge
          fetch-depth: 1

      - name: Report versions
        run: |
          DSH_VER=$(node -p "require('./dsh/package.json').version")
          DSH_SHA=$(git -C dsh rev-parse --short HEAD)
          PURGE_VER=$(node -p "require('./purge/package.json').version")
          PURGE_SHA=$(git -C purge rev-parse --short HEAD)
          echo "DSH_VER=$DSH_VER" >> $GITHUB_ENV
          echo "DSH_SHA=$DSH_SHA" >> $GITHUB_ENV
          {
            echo "### 版本信息"
            echo "- DSH: \`$DSH_VER\` ($DSH_SHA)"
            echo "- purge: \`$PURGE_VER\` ($PURGE_SHA)"
            echo "- 缓存代数: \`$CACHE_REV\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Apply host patches
        run: |
          cd dsh
          git apply --verbose ../recipe/patches/host.patch
          git apply --verbose ../recipe/patches/branding.patch
          git apply --verbose ../recipe/patches/fileprompt.patch
          git apply --verbose ../recipe/patches/cwdvar.patch
          echo "✓ 四组补丁全部应用"
          cp ../recipe/config/env.macos apps/desktop/.env.macos
          echo "✓ .env.macos 就位"

      - name: Verify blacklisted prompt is gone from source
        run: |
          set -e
          HITS=$(grep -rn 'Tokens prefixed with @' dsh/packages/ --include='*.ts' 2>/dev/null | wc -l | tr -d ' ')
          echo "source hits: $HITS"
          if [ "$HITS" != "0" ]; then
            echo "::error::黑名单文案仍在源码中（$HITS 处）"
            grep -rn 'Tokens prefixed with @' dsh/packages/ --include='*.ts' | head -5
            exit 1
          fi
          echo "✓ 源码层黑名单文案 0 命中"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── 缓存 1：pnpm store（依赖包本体，最大头） ──
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/pnpm/store
            ~/.local/share/pnpm/store
            dsh/node_modules/.cache
          key: pnpm-macOS-${{ env.CACHE_REV }}-${{ hashFiles('dsh/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-macOS-${{ env.CACHE_REV }}-
            pnpm-macOS-

      # ── 缓存 2：构建产物（tsc 增量 + tsdown 输出） ──
      - name: Cache DSH build outputs
        id: cache-build
        if: ${{ !inputs.skip_build }}
        uses: actions/cache@v4
        with:
          path: |
            dsh/**/dist
            dsh/**/lib
            dsh/**/*.tsbuildinfo
          key: dshbuild-macOS-${{ env.CACHE_REV }}-${{ env.DSH_SHA }}-${{ hashFiles('recipe/patches/*.patch') }}
          restore-keys: |
            dshbuild-macOS-${{ env.CACHE_REV }}-${{ env.DSH_SHA }}-
            dshbuild-macOS-${{ env.CACHE_REV }}-

      # ── 缓存 3：Electron 下载与解包 ──
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            dsh/apps/desktop/.desktop-build/downloads
          key: electron-macOS-${{ hashFiles('dsh/apps/desktop/package.json') }}
          restore-keys: |
            electron-macOS-

      - name: Install dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build DSH
        if: ${{ !inputs.skip_build && steps.cache-build.outputs.cache-hit != 'true' }}
        working-directory: dsh
        run: pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build DSH (cache hit, skip)
        if: ${{ inputs.skip_build || steps.cache-build.outputs.cache-hit == 'true' }}
        run: echo "✓ 复用已缓存的构建产物，跳过编译"

      - name: Package macOS arm64 (unsigned)
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          DSH_DESKTOP_PACKAGE_NAME: 'dsh2-desktop'
          DSH_DESKTOP_ARTIFACT_SLUG: 'dsh2'
          DSH_DESKTOP_URL_SCHEME: 'dsh2'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Verify userData isolation
        run: |
          set -e
          ART=dsh/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts
          APP=$(find "$ART" -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "::error::找不到 .app"; exit 1; fi
          echo "APP=$APP"
          echo "--- Bundle ID ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          echo "--- productName (决定 userData 目录) ---"
          npx --yes @electron/asar extract-file "$APP/Contents/Resources/app.asar" package.json 2>/dev/null || true
          node - <<'JS'
          const fs = require('fs')
          const p = 'package.json'
          if (!fs.existsSync(p)) { console.error('::error::无法提取 asar 内 package.json'); process.exit(1) }
          const d = JSON.parse(fs.readFileSync(p, 'utf8'))
          console.log('  name        =', d.name)
          console.log('  productName =', d.productName)
          console.log('  dshDesktopAppId =', d.dshDesktopAppId)
          const bad = []
          if (!d.productName) bad.push('productName 缺失 -> userData 会与官方冲突')
          if (d.name === '@deepseek-ai/dsh-desktop') bad.push('name 与官方相同 -> 单实例锁冲突')
          if (d.dshDesktopAppId === 'com.deepseek.harness') bad.push('AppID 未覆盖')
          if (bad.length) { bad.forEach(b => console.error('::error::' + b)); process.exit(1) }
          console.log('✓ userData 与官方隔离')
          JS

      - name: Verify blacklisted prompt is gone from packaged app
        run: |
          set -e
          ART_ROOT=dsh/apps/desktop/.desktop-build/targets/mac-arm64
          APP=$(find "$ART_ROOT" -maxdepth 4 -name '*.app' -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find dsh/apps/desktop/.desktop-build -maxdepth 6 -name '*.app' -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "::warning::未找到 .app 目录，跳过产物校验"
            exit 0
          fi
          echo "APP=$APP"
          HITS=$(grep -r "Tokens prefixed with @" "$APP" 2>/dev/null | wc -l | tr -d ' ')
          echo "packaged hits: $HITS"
          if [ "$HITS" != "0" ]; then
            echo "::error::打包产物中黑名单文案仍在（$HITS 处）"
            grep -rn "Tokens prefixed with @" "$APP" 2>/dev/null | head -3
            exit 1
          fi
          echo "✓ 打包产物黑名单文案 0 命中"
          echo "- 打包产物校验：0 命中" >> "$GITHUB_STEP_SUMMARY"

      - name: List artifacts
        run: |
          echo "=== 产物 ==="
          ls -lh dsh/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/ 2>/dev/null || echo "(unsigned-artifacts 为空)"
          find dsh/apps/desktop/.desktop-build -maxdepth 5 \( -name '*.dmg' -o -name '*.zip' \) 2>/dev/null | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh2-macos-arm64-${{ github.run_number }}
          # 精确路径：upload-artifact 的 ** 不匹配点开头的目录（.desktop-build）
          path: |
            dsh/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
            dsh/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.zip
          retention-days: 90
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/build-')
        uses: softprops/action-gh-release@v2
        with:
          name: dsh2 ${{ env.DSH_VER }} (${{ github.ref_name }})
          tag_name: ${{ github.ref_name }}
          body: |
            **冷夜的 dsh 小作坊** — 基于 DeepSeek Harness `${{ env.DSH_VER }}` (${{ env.DSH_SHA }})

            - 内置：冷夜的全能破甲助手 (dsh-purge 1.1.71 满血版)
            - 品牌：冷夜的 dsh 小作坊 / com.buluo.dsh2 / dsh2://
            - 数据目录：`~/.dsh2`（与官方版完全隔离）
            - 未签名，首次打开需右键 → 打开

            校验：源码层与打包产物中黑名单文案均 0 命中。
          files: |
            dsh/apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
