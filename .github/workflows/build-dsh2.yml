name: Build 冷夜的 dsh 小作坊

on:
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: 'DSH source ref (tag/branch/sha)'
        required: false
        default: 'master'
      product_name:
        description: 'App display name'
        required: false
        default: '冷夜的 dsh 小作坊'
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  NODE_VERSION: '24.18.1'
  PNPM_VERSION: '11.28.5'
  DSH_REPO: 'deepseek-ai/deepseek-harness'
  PURGE_REPO: 'BuLu0208/dsh-purge1171'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Checkout DSH source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DSH_REPO }}
          ref: ${{ inputs.dsh_ref || 'master' }}
          path: dsh
          fetch-depth: 1

      - name: Checkout dsh-purge (1.1.71 满血版)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PURGE_REPO }}
          ref: master
          path: purge
          fetch-depth: 1

      - name: Report versions
        run: |
          echo "### 版本信息" >> "$GITHUB_STEP_SUMMARY"
          echo "- DSH: $(node -p "require('./dsh/package.json').version")" >> "$GITHUB_STEP_SUMMARY"
          echo "- DSH commit: $(git -C dsh rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- purge: $(node -p "require('./purge/package.json').version")" >> "$GITHUB_STEP_SUMMARY"
          echo "- purge commit: $(git -C purge rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          node -p "require('./purge/package.json').version"
          node -p "require('./purge/package.json').dshTarget || 'n/a'"

      - name: Apply host patches
        run: |
          cd dsh
          echo "=== 应用 purge host patches ==="
          git apply --verbose ../recipe/patches/host.patch
          echo "=== 应用品牌参数化 ==="
          git apply --verbose ../recipe/patches/branding.patch
          echo "=== 应用上游黑名单文案改写 ==="
          git apply --verbose ../recipe/patches/fileprompt.patch
          echo "✓ 补丁全部应用成功"

      - name: Verify blacklisted prompt is gone from source
        run: |
          set -e
          hits=$(grep -rn 'Tokens prefixed with @' dsh/packages/ --include='*.ts' 2>/dev/null | wc -l | tr -d ' ')
          echo "source hits: $hits"
          if [ "$hits" != "0" ]; then
            echo "::error::黑名单文案仍在源码中（$hits 处）"
            grep -rn 'Tokens prefixed with @' dsh/packages/ --include='*.ts' | head -5
            exit 1
          fi
          echo "✓ 源码层黑名单文案 0 命中"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Build DSH
        working-directory: dsh
        run: pnpm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

      - name: Prepare runtime
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          DSH_DESKTOP_ARTIFACT_SLUG: 'dsh2'
          DSH_DESKTOP_URL_SCHEME: 'dsh2'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run --filter @deepseek-ai/dsh-desktop prepare:runtime

      - name: Prepare package
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run prepare:desktop

      - name: Package macOS arm64 (unsigned)
        working-directory: dsh
        env:
          DSH_DESKTOP_APP_ID: 'com.buluo.dsh2'
          DSH_DESKTOP_PRODUCT_NAME: ${{ inputs.product_name || '冷夜的 dsh 小作坊' }}
          DSH_DESKTOP_ARTIFACT_SLUG: 'dsh2'
          DSH_DESKTOP_URL_SCHEME: 'dsh2'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Verify blacklisted prompt is gone from packaged app
        run: |
          set -e
          APP=$(find dsh/apps/desktop/dist -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::warning::未找到 .app，尝试从 dmg 挂载校验"
            DMG=$(find dsh/apps/desktop/dist -name '*.dmg' | head -1)
            if [ -n "$DMG" ]; then
              hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/dsh2mnt >/dev/null
              APP=$(find /tmp/dsh2mnt -maxdepth 2 -name '*.app' -type d | head -1)
            fi
          fi
          if [ -z "$APP" ]; then
            echo "::error::找不到打包后的 .app"
            exit 1
          fi
          echo "APP=$APP"
          HITS=$(grep -r "Tokens prefixed with @" "$APP" 2>/dev/null | wc -l | tr -d ' ')
          echo "packaged hits: $HITS"
          if [ "$HITS" != "0" ]; then
            echo "::error::打包产物中黑名单文案仍在（$HITS 处），上游会拒绝所有请求"
            grep -rn "Tokens prefixed with @" "$APP" 2>/dev/null | head -3
            exit 1
          fi
          echo "✓ 打包产物黑名单文案 0 命中"
          echo "### 校验通过" >> "$GITHUB_STEP_SUMMARY"
          echo "- 源码层：0 命中" >> "$GITHUB_STEP_SUMMARY"
          echo "- 打包产物：0 命中" >> "$GITHUB_STEP_SUMMARY"

      - name: List artifacts
        run: |
          find dsh/apps/desktop/dist -type f \( -name '*.dmg' -o -name '*.zip' \) -exec ls -lh {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh2-macos-arm64-${{ github.run_number }}
          path: |
            dsh/apps/desktop/dist/**/*.dmg
            dsh/apps/desktop/dist/**/*.zip
          retention-days: 30
          if-no-files-found: error
